[tool.uv.workspace]
members = ["packages/catalog", "agent", "web/api"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.8"]

[tool.ruff]
line-length = 100
extend-exclude = ["spikes"]
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["packages/catalog/tests", "agent/tests", "web/api/tests"]
addopts = "--import-mode=importlib"
