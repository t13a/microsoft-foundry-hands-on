[project]
name = "web-api"
version = "0.1.0"
description = "BFF: SPA の配信、カタログ API、Responses の中継"
requires-python = ">=3.13"
dependencies = [
    "azure-identity>=1.27.0",
    "azure-storage-blob>=12.31.1",
    "catalog",
    "fastapi>=0.115",
    "httpx>=0.28.1",
    "uvicorn[standard]>=0.32",
]

[tool.uv.sources]
catalog = { workspace = true }

[build-system]
requires = ["uv_build>=0.9,<0.14"]
build-backend = "uv_build"
